    books:[["主","6冊目『高市政権17国策株』","国策テーマの読み解き方"],["サブ","7冊目『急落こそチャンス』","攻めた後の守り方"]],
    gpts:"ハマースコアGPT Pro",
    news:"国策・テーマ株の動きも、毎週書いています", waitlist:false},
};

/* ---------- state ---------- */
let idx=0; const answers=new Array(Q.length).fill(null);
const $=id=>document.getElementById(id);

function setBar(){ $("bar").style.width = (answers.filter(x=>x!==null).length/Q.length*100)+"%"; }

function renderQ(){
  const item=Q[idx];
  $("qcount").textContent=`Q${idx+1} / ${Q.length}`;
  $("qtext").textContent=item.q;
  const wrap=$("opts"); wrap.innerHTML="";
  item.a.forEach(([letter,text])=>{
    const b=document.createElement("button");
    b.className="opt"; b.type="button";
    b.innerHTML=`<span class="mk">${letter}</span><span>${text}</span>`;
    if(answers[idx]===letter){ b.style.borderColor="var(--type)"; b.style.background="var(--type-wash)"; }
    b.onclick=()=>{ answers[idx]=letter; setBar(); if(idx<Q.length-1){ idx++; renderQ(); $("quiz").scrollIntoView({behavior:"smooth",block:"start"});} else { showResult(); } };
    wrap.appendChild(b);
  });
  $("back").style.visibility = idx===0 ? "hidden":"visible";
}

$("back").onclick=()=>{ if(idx>0){ idx--; renderQ(); } };

function tally(){
  const c={A:0,B:0,C:0,D:0};
  answers.forEach(x=>{ if(x) c[x]++; });
  let max=Math.max(c.A,c.B,c.C,c.D);
  let top=Object.keys(c).filter(k=>c[k]===max);
  if(top.length>1){ // tiebreak: Q9(index8) then Q1(index0)
    if(answers[8] && top.includes(answers[8])) return answers[8];
    if(answers[0] && top.includes(answers[0])) return answers[0];
  }
  return top[0];
}

function showResult(){ renderResult(TYPES[tally()]); }

/* renderResult は、診断完了時にも、共有リンク（#haito など）で直接開いたときにも使う */
function renderResult(t){
  document.documentElement.style.setProperty("--type",t.c);
  document.documentElement.style.setProperty("--type2",t.c2);
  document.documentElement.style.setProperty("--type-wash",t.wash);
  $("bar").style.width="100%";

  // シェアURLは「タイプ別OGPページ」(r/<slug>.html) を指す＝SNSで正しいカードが出る
  const shareUrl = new URL("r/"+SLUG[t.key]+".html", location.href).href;
  const shareText=encodeURIComponent(`私の投資スタイルは【${t.name}】${t.emoji}（${t.catch}）でした！\nあなたのタイプは？ 週末30分AI投資・投資スタイル診断`);
  const url=encodeURIComponent(shareUrl);

  const booksHtml=t.books.map(([role,tt,sub])=>`
    <a class="book" href="${AUTHOR}" target="_blank" rel="noopener">
      <span class="bt">${role==="主"?"★":"＋"}</span>
      <span class="bi"><span class="role">${role==="主"?"まず読む1冊":"次に読む"}</span>
      <span class="tt">${tt}<br><small>${sub}</small></span></span>
    </a>`).join("");

  const waitlistHtml = t.waitlist ? `
    <a class="cta alert" href="${WAITLIST}" target="_blank" rel="noopener">
      ⚠️ あなたの一番の敵は「減配」です
      <small>累進配当30社の"方針変更"を見張る無料通知に登録する →</small>
    </a>` : "";

  const dots = ["A","B","C","D"].map(k=>{
    const on=k===t.key; const tt=TYPES[k];
    return `<div class="t ${on?'on':''}" ${on?`style="background:linear-gradient(135deg,${tt.c},${tt.c2})"`:''}>${tt.emoji} ${tt.name.replace("型","")}</div>`;
  }).join("");

  $("result").innerHTML=`
    <div class="rcard">
      <div class="rhead">
        <span class="emoji">${t.emoji}</span>
        <div class="rlabel">あなたの投資スタイルは</div>
        <h2>${t.name}</h2>
        <div class="catch">── ${t.catch}</div>
      </div>
      <div class="rbody">
        <div class="sect"><h3>💪 あなたの強み</h3><p>${t.strong}</p></div>
        <div class="sect"><h3>⚠️ 気をつけたいこと</h3><p class="note">${t.caution}</p></div>
        <div class="sect"><h3>🗓 週末30分でやること</h3>
          <ol class="routine">${t.routine.map(r=>`<li>${r}</li>`).join("")}</ol>
        </div>
        <div class="sect"><h3>📚 あなたに合う本</h3>
          <div class="books">${booksHtml}</div>
          <div class="gpts">🤖 合うAIツール：<b>${t.gpts}</b> ／ どのタイプにも効く <b>5冊目『AI×note×投資で月3万円』</b></div>
        </div>
        <a class="cta primary" href="${SUBSTACK}" target="_blank" rel="noopener">
          📨 無料ニュースレター「週末30分AI投資ログ」を受け取る
          <small>${t.news}／週1・メールで届きます。いつでも解除できます</small>
        </a>
        ${waitlistHtml}
        <div class="share">
          <div class="lbl">結果をシェアして、友だちのタイプも調べてみよう</div>
          <div class="row">
            <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${url}" target="_blank" rel="noopener">𝕏 でシェア</a>
            <a href="https://www.threads.net/intent/post?text=${shareText}%20${url}" target="_blank" rel="noopener">Threads</a>
            <a href="https://social-plugins.line.me/lineit/share?url=${url}" target="_blank" rel="noopener">LINE</a>
          </div>
        </div>
        <div class="alltypes">${dots}</div>
        <button class="btn ghost again" id="retry">もう一度診断する</button>
        <p class="disclaimer">※この診断は投資スタイルの分類であり、特定の銘柄の売買を推奨するものではありません。投資は自己責任で、最終的な判断はご自身で行ってください。</p>
      </div>
    </div>`;

  $("intro").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("result").scrollIntoView({behavior:"smooth",block:"start"});
  $("retry").onclick=reset;
}

function reset(){
  idx=0; answers.fill(null); setBar();
  if(location.hash){ history.replaceState(null,"",location.pathname+location.search); }
  document.documentElement.style.setProperty("--type","var(--brand)");
  $("result").classList.add("hidden"); $("quiz").classList.add("hidden");
  $("intro").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

$("start").onclick=()=>{ $("intro").classList.add("hidden"); $("quiz").classList.remove("hidden"); renderQ(); setBar(); };

/* theme toggle */
$("theme").onclick=()=>{
  const r=document.documentElement;
  const cur=r.getAttribute("data-theme");
  const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  r.setAttribute("data-theme", isDark?"light":"dark");
};

/* 共有リンク（例: index.html#haito）で開かれたら、その結果を直接表示する */
(function deepLink(){
  const h=location.hash.replace("#","");
  const entry=Object.entries(SLUG).find(([k,s])=>s===h);
  if(entry){ renderResult(TYPES[entry[0]]); }
})();
</script>
</body>
</html>
